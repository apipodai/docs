openapi: 3.1.0
info:
  title: MiniMax H3 Reference to Video API
  version: 1.0.0
  description: MiniMax H3 参考生视频是 MiniMax H3 多模态视频系列的独立模式，组合图片、视频和音频参考素材；APIPod
    当前为该系列提供 768P 或 2K、4 至 15 秒的异步生成契约。在 APIPod 中，公开模型 ID 为
    minimax-h3-r2v，支持图生视频、视频到视频；接受文本、图片、音频、视频输入，并通过异步视频任务返回结果。
servers:
  - url: https://api.apipod.ai
    description: 生产环境
paths:
  /v1/videos/genertions:
    post:
      summary: 创建生成任务
      description: MiniMax H3 参考生视频是 MiniMax H3 多模态视频系列的独立模式，组合图片、视频和音频参考素材；APIPod
        当前为该系列提供 768P 或 2K、4 至 15 秒的异步生成契约。在 APIPod 中，公开模型 ID 为
        minimax-h3-r2v，支持图生视频、视频到视频；接受文本、图片、音频、视频输入，并通过异步视频任务返回结果。
      operationId: create-minimax-h3-minimax-h3-r2v
      tags:
        - MiniMax H3 Reference to Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: MiniMax H3 Reference to Video
              properties:
                model:
                  type: string
                  title: Model ID
                  description: APIPod 公开模型 ID。
                  const: minimax-h3-r2v
                prompt:
                  type: string
                  title: Prompt
                  default: ""
                  description: 生成或编辑指令。 最大字符串长度：7000。 最小字符串长度：1。
                image_urls:
                  type: array
                  title: Reference Images
                  items:
                    type: string
                  description: 可公开访问的源图片或参考图 URL。
                video_urls:
                  type: array
                  title: Reference Videos
                  items:
                    type: string
                  description: 可公开访问的参考视频 URL。
                audio_urls:
                  type: array
                  title: Reference Audio
                  description: 可公开访问的参考音频 URL。
                  items:
                    type: string
                resolution:
                  type: string
                  title: Resolution
                  description: 视频分辨率，可选 768P 或 2K。
                  enum:
                    - 768P
                    - 2K
                  default: 2K
                duration:
                  type: integer
                  title: Duration
                  description: 视频时长，单位为秒。 最小值：4。 最大值：15。
                  default: 4
                aspect_ratio:
                  type: string
                  title: Aspect Ratio
                  description: 输出宽高比。
                  enum:
                    - adaptive
                    - 21:9
                    - 16:9
                    - 4:3
                    - 1:1
                    - 3:4
                    - 9:16
                  default: adaptive
              required:
                - model
                - prompt
                - duration
            example:
              model: minimax-h3-r2v
              prompt: A cinematic tracking shot through a rain-soaked neon street, realistic
                motion, synchronized ambient sound.
              image_urls:
                - https://cdn.example.com/reference-1.jpg
              video_urls:
                - https://cdn.example.com/reference.mp4
              audio_urls:
                - https://cdn.example.com/reference.mp3
              resolution: 2K
              duration: 4
              aspect_ratio: adaptive
      responses:
        "200":
          description: 任务已受理
          content:
            application/json:
              schema:
                type: object
                title: Task Submit Response
                description: Standard response for task submission
                properties:
                  code:
                    type: integer
                    description: HTTP 状态码。
                  data:
                    type: object
                    title: Task Submit Data
                    description: 响应数据。
                    properties:
                      task_id:
                        type: string
                        description: 用于查询任务状态的 APIPod 任务 ID。
                  message:
                    type: string
                    description: 响应消息。
                required:
                  - code
                  - message
                  - data
              example:
                code: 200
                message: success
                data:
                  task_id: vid_task_01JEXAMPLE
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl https://api.apipod.ai/v1/videos/genertions \
              -H "Authorization: Bearer $APIPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
              "model": "minimax-h3-r2v",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "image_urls": [
                "https://cdn.example.com/reference-1.jpg"
              ],
              "video_urls": [
                "https://cdn.example.com/reference.mp4"
              ],
              "audio_urls": [
                "https://cdn.example.com/reference.mp3"
              ],
              "resolution": "2K",
              "duration": 4,
              "aspect_ratio": "adaptive"
            }'
        - lang: Python
          label: Python
          source: >-
            import os

            import requests


            payload = {
              "model": "minimax-h3-r2v",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "image_urls": [
                "https://cdn.example.com/reference-1.jpg"
              ],
              "video_urls": [
                "https://cdn.example.com/reference.mp4"
              ],
              "audio_urls": [
                "https://cdn.example.com/reference.mp3"
              ],
              "resolution": "2K",
              "duration": 4,
              "aspect_ratio": "adaptive"
            }


            response = requests.post(
                "https://api.apipod.ai/v1/videos/genertions",
                headers={
                    "Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}",
                    "Content-Type": "application/json",
                },
                json=payload,
                timeout=60,
            )

            response.raise_for_status()

            print(response.json())
        - lang: Go
          label: Go
          source: >-
            package main


            import (
                "bytes"
                "encoding/json"
                "fmt"
                "net/http"
                "os"
            )


            func main() {
                payload := map[string]any{}
                if err := json.Unmarshal([]byte(`{
              "model": "minimax-h3-r2v",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "image_urls": [
                "https://cdn.example.com/reference-1.jpg"
              ],
              "video_urls": [
                "https://cdn.example.com/reference.mp4"
              ],
              "audio_urls": [
                "https://cdn.example.com/reference.mp3"
              ],
              "resolution": "2K",
              "duration": 4,
              "aspect_ratio": "adaptive"
            }`), &payload); err != nil {
                    panic(err)
                }
                body, err := json.Marshal(payload)
                if err != nil {
                    panic(err)
                }

                req, err := http.NewRequest(http.MethodPost, "https://api.apipod.ai/v1/videos/genertions", bytes.NewReader(body))
                if err != nil {
                    panic(err)
                }
                req.Header.Set("Authorization", "Bearer "+os.Getenv("APIPOD_API_KEY"))
                req.Header.Set("Content-Type", "application/json")

                resp, err := http.DefaultClient.Do(req)
                if err != nil {
                    panic(err)
                }
                defer resp.Body.Close()
                fmt.Println(resp.Status)
            }
        - lang: Rust
          label: Rust
          source: >-
            use reqwest::Client;

            use serde_json::json;

            use std::env;


            #[tokio::main]

            async fn main() -> Result<(), Box<dyn std::error::Error>> {
                let payload = json!({
              "model": "minimax-h3-r2v",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "image_urls": [
                "https://cdn.example.com/reference-1.jpg"
              ],
              "video_urls": [
                "https://cdn.example.com/reference.mp4"
              ],
              "audio_urls": [
                "https://cdn.example.com/reference.mp3"
              ],
              "resolution": "2K",
              "duration": 4,
              "aspect_ratio": "adaptive"
            });
                let response = Client::new()
                    .post("https://api.apipod.ai/v1/videos/genertions")
                    .bearer_auth(env::var("APIPOD_API_KEY")?)
                    .json(&payload)
                    .send()
                    .await?
                    .error_for_status()?;

                println!("{}", response.text().await?);
                Ok(())
            }
        - lang: JavaScript
          label: JavaScript
          source: >-
            const response = await
            fetch("https://api.apipod.ai/v1/videos/genertions", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(
              {
                "model": "minimax-h3-r2v",
                "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
                "image_urls": [
                  "https://cdn.example.com/reference-1.jpg"
                ],
                "video_urls": [
                  "https://cdn.example.com/reference.mp4"
                ],
                "audio_urls": [
                  "https://cdn.example.com/reference.mp3"
                ],
                "resolution": "2K",
                "duration": 4,
                "aspect_ratio": "adaptive"
              }
              ),
            });


            if (!response.ok) {
              throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);
            }


            console.log(await response.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: 在 Authorization 请求头中使用 Bearer APIPod_API_KEY。
