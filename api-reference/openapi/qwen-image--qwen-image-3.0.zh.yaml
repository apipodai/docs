openapi: 3.1.0
info:
  title: Qwen Image 3.0 API
  version: 1.0.0
  description: Qwen Image 3.0 能一次生成信息密集的图像：报纸整版、多格信息图、LaTeX 论文页、菜单与 UI 界面，文字小到
    10px 依然清晰，覆盖 12 国语言。同一模型 ID 同时支持文生图与指令式编辑（最多 3 张参考图），每次返回 1~6 张 PNG。在 APIPod
    中，公开模型 ID 为 qwen-image-3.0，支持文生图、图片生成与编辑；接受文本、图片输入，并通过异步图片任务返回结果。
servers:
  - url: https://api.apipod.ai
    description: 生产环境
paths:
  /v1/images/generations:
    post:
      summary: 创建生成任务
      description: Qwen Image 3.0 能一次生成信息密集的图像：报纸整版、多格信息图、LaTeX 论文页、菜单与 UI 界面，文字小到
        10px 依然清晰，覆盖 12 国语言。同一模型 ID 同时支持文生图与指令式编辑（最多 3 张参考图），每次返回 1~6 张 PNG。在
        APIPod 中，公开模型 ID 为 qwen-image-3.0，支持文生图、图片生成与编辑；接受文本、图片输入，并通过异步图片任务返回结果。
      operationId: create-qwen-image-qwen-image-3.0
      tags:
        - Qwen Image 3.0
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Qwen Image 3.0
              properties:
                aspect_ratio:
                  type: string
                  title: Aspect Ratio
                  description: 输出宽高比，与 resolution 搭配使用；接受 1:8 到 8:1 的任意比例。
                  enum:
                    - auto
                    - 1:1
                    - 1:2
                    - 2:1
                    - 1:3
                    - 3:1
                    - 1:4
                    - 4:1
                    - 1:8
                    - 8:1
                    - 2:3
                    - 3:2
                    - 3:4
                    - 4:3
                    - 4:5
                    - 5:4
                    - 9:16
                    - 16:9
                    - 9:21
                    - 21:9
                image_urls:
                  type: array
                  title: Reference Images
                  description: 可选。不传即为文生图；传入 1 到 3 张图片后，同一模型切换为指令式编辑。
                  items:
                    type: string
                    title: Image URL
                model:
                  type: string
                  title: Model ID
                  description: APIPod 公开模型 ID。
                  const: qwen-image-3.0
                n:
                  type: integer
                  title: Number of images
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                    - 6
                  default: 1
                  description: 单次请求生成的图片数量；每张返回的图片分别计费。 最小值：1。 最大值：6。
                prompt:
                  type: string
                  title: Prompt
                  description: 要生成的内容；传入 image_urls 时则为编辑指令。提示词最长约 4.5k token。 最大字符串长度：32000。
                prompt_extend:
                  type: boolean
                  title: Prompt Extend
                  description: 渲染前先扩写简短提示词（增加 3 到 5 秒）；提示词已精确详尽时建议关闭。
                  default: true
                resolution:
                  type: string
                  title: Resolution
                  description: 推荐的输出档位；与 aspect_ratio 搭配时由 API 换算出精确像素。未传 size 的请求按 2K 档计费。
                  enum:
                    - 1K
                    - 2K
                  default: 2K
                seed:
                  type: integer
                  title: Seed
                  description: 随机种子；复用同一种子可获得更稳定的结果。 最小值：0。 最大值：2147483647。
                size:
                  type: string
                  title: Size
                  description: 精确像素覆盖，格式为「宽*高」；总像素须在 512*512 到 2048*2048 之间、比例 1:8 到 8:1。优先级高于 resolution 与 aspect_ratio；不传则由模型自选。
                watermark:
                  type: boolean
                  title: Watermark
                  description: 在右下角添加 AI 生成的水印。
                  default: false
              required:
                - model
                - prompt
            example:
              aspect_ratio: 16:9
              model: qwen-image-3.0
              n: 1
              prompt: A premium product photograph on a dark studio set, precise typography,
                soft rim lighting, highly detailed.
              resolution: 2K
      responses:
        "200":
          description: 任务已受理
          content:
            application/json:
              schema:
                type: object
                title: Task Submit Response
                description: Standard response for task submission
                properties:
                  code:
                    type: integer
                    description: HTTP 状态码。
                  data:
                    type: object
                    title: Task Submit Data
                    description: 响应数据。
                    properties:
                      task_id:
                        type: string
                        description: 用于查询任务状态的 APIPod 任务 ID。
                  message:
                    type: string
                    description: 响应消息。
                required:
                  - code
                  - message
                  - data
              example:
                code: 200
                message: success
                data:
                  task_id: img_task_01JEXAMPLE
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl https://api.apipod.ai/v1/images/generations \
              -H "Authorization: Bearer $APIPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
              "aspect_ratio": "16:9",
              "model": "qwen-image-3.0",
              "n": 1,
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "resolution": "2K"
              
            }'
        - lang: Python
          label: Python
          source: >-
            import os

            import requests


            payload = {
              "aspect_ratio": "16:9",
              "model": "qwen-image-3.0",
              "n": 1,
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "resolution": "2K"
              
            }


            response = requests.post(
                "https://api.apipod.ai/v1/images/generations",
                headers={
                    "Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}",
                    "Content-Type": "application/json",
                },
                json=payload,
                timeout=60,
            )

            response.raise_for_status()

            print(response.json())
        - lang: Go
          label: Go
          source: >-
            package main


            import (
                "bytes"
                "encoding/json"
                "fmt"
                "net/http"
                "os"
            )


            func main() {
                payload := map[string]any{}
                if err := json.Unmarshal([]byte(`{
              "aspect_ratio": "16:9",
              "model": "qwen-image-3.0",
              "n": 1,
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "resolution": "2K"
              
            }`), &payload); err != nil {
                    panic(err)
                }
                body, err := json.Marshal(payload)
                if err != nil {
                    panic(err)
                }

                req, err := http.NewRequest(http.MethodPost, "https://api.apipod.ai/v1/images/generations", bytes.NewReader(body))
                if err != nil {
                    panic(err)
                }
                req.Header.Set("Authorization", "Bearer "+os.Getenv("APIPOD_API_KEY"))
                req.Header.Set("Content-Type", "application/json")

                resp, err := http.DefaultClient.Do(req)
                if err != nil {
                    panic(err)
                }
                defer resp.Body.Close()
                fmt.Println(resp.Status)
            }
        - lang: Rust
          label: Rust
          source: >-
            use reqwest::Client;

            use serde_json::json;

            use std::env;


            #[tokio::main]

            async fn main() -> Result<(), Box<dyn std::error::Error>> {
                let payload = json!({
              "aspect_ratio": "16:9",
              "model": "qwen-image-3.0",
              "n": 1,
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "resolution": "2K"
              
            });
                let response = Client::new()
                    .post("https://api.apipod.ai/v1/images/generations")
                    .bearer_auth(env::var("APIPOD_API_KEY")?)
                    .json(&payload)
                    .send()
                    .await?
                    .error_for_status()?;

                println!("{}", response.text().await?);
                Ok(())
            }
        - lang: JavaScript
          label: JavaScript
          source: >-
            const response = await
            fetch("https://api.apipod.ai/v1/images/generations", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(
              {
                "aspect_ratio": "16:9",
                "model": "qwen-image-3.0",
                "n": 1,
                "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
                "resolution": "2K"
                
              }
              ),
            });


            if (!response.ok) {
              throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);
            }


            console.log(await response.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: 在 Authorization 请求头中使用 Bearer APIPod_API_KEY。
