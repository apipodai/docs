openapi: 3.1.0
info:
  title: Seedance 1.0 Lite Image to Video Reference API
  version: 1.0.0
  description: Seedance 1.0 Lite Image to Video is a standard route that animates
    a required first-frame image and can use an optional last frame where the
    public schema allows it. The Seedance family emphasizes prompt following,
    coherent motion, multi-shot storytelling, and synchronized audio. In APIPod,
    the public model ID is seedance-1.0-lite-i2v-ref. It supports
    image-to-video, accepts text and image inputs, and returns results through
    asynchronous video tasks.
servers:
  - url: https://api.apipod.ai
    description: Production
paths:
  /v1/videos/generations:
    post:
      summary: Create Generation Task
      description: Seedance 1.0 Lite Image to Video is a standard route that animates
        a required first-frame image and can use an optional last frame where
        the public schema allows it. The Seedance family emphasizes prompt
        following, coherent motion, multi-shot storytelling, and synchronized
        audio. In APIPod, the public model ID is seedance-1.0-lite-i2v-ref. It
        supports image-to-video, accepts text and image inputs, and returns
        results through asynchronous video tasks.
      operationId: create-seedance-seedance-1-0-lite-i2v-ref
      tags:
        - Seedance 1.0 Lite Image to Video Reference
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Seedance 1.0 Lite Image to video reference
              properties:
                model:
                  type: string
                  title: Model ID
                  description: Public APIPod model ID.
                  const: seedance-1.0-lite-i2v-ref
                prompt:
                  type: string
                  title: Prompt
                  maxLength: 2000
                duration:
                  type: integer
                  title: Duration
                  enum:
                    - 4
                    - 5
                    - 6
                    - 7
                    - 8
                    - 9
                    - 10
                    - 11
                    - 12
                  default: 5
                image_urls:
                  type: array
                  title: Reference Images
                  items:
                    type: string
                resolution:
                  type: string
                  title: Resolution
                  enum:
                    - 480p
                    - 720p
                  default: 720p
                aspect_ratio:
                  type: string
                  title: Aspect Ratio
                  enum:
                    - adaptive
                    - 16:9
                    - 4:3
                    - 1:1
                    - 3:4
                    - 9:16
                    - 21:9
                  default: adaptive
                callback_url:
                  type: string
                  title: Callback URL
                  default: ""
              required:
                - model
                - prompt
                - image_urls
            example:
              model: seedance-1.0-lite-i2v-ref
              prompt: A cinematic tracking shot through a rain-soaked neon street, realistic
                motion, synchronized ambient sound.
              duration: 5
              image_urls:
                - https://cdn.example.com/reference-1.jpg
              resolution: 720p
              aspect_ratio: adaptive
      responses:
        "200":
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                title: Task Submit Response
                description: Standard response for task submission
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    title: Task Submit Data
                    description: Data content for task submission
                    properties:
                      task_id:
                        type: string
                        description: generatation task id
                  message:
                    type: string
                required:
                  - code
                  - message
                  - data
              example:
                code: 200
                message: success
                data:
                  task_id: vid_task_01JEXAMPLE
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl https://api.apipod.ai/v1/videos/generations \
              -H "Authorization: Bearer $APIPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
              "model": "seedance-1.0-lite-i2v-ref",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "duration": 5,
              "image_urls": [
                "https://cdn.example.com/reference-1.jpg"
              ],
              "resolution": "720p",
              "aspect_ratio": "adaptive"
            }'
        - lang: Python
          label: Python
          source: >-
            import os

            import requests


            payload = {
              "model": "seedance-1.0-lite-i2v-ref",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "duration": 5,
              "image_urls": [
                "https://cdn.example.com/reference-1.jpg"
              ],
              "resolution": "720p",
              "aspect_ratio": "adaptive"
            }


            response = requests.post(
                "https://api.apipod.ai/v1/videos/generations",
                headers={
                    "Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}",
                    "Content-Type": "application/json",
                },
                json=payload,
                timeout=60,
            )

            response.raise_for_status()

            print(response.json())
        - lang: Go
          label: Go
          source: >-
            package main


            import (
                "bytes"
                "encoding/json"
                "fmt"
                "net/http"
                "os"
            )


            func main() {
                payload := map[string]any{}
                if err := json.Unmarshal([]byte(`{
              "model": "seedance-1.0-lite-i2v-ref",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "duration": 5,
              "image_urls": [
                "https://cdn.example.com/reference-1.jpg"
              ],
              "resolution": "720p",
              "aspect_ratio": "adaptive"
            }`), &payload); err != nil {
                    panic(err)
                }
                body, err := json.Marshal(payload)
                if err != nil {
                    panic(err)
                }

                req, err := http.NewRequest(http.MethodPost, "https://api.apipod.ai/v1/videos/generations", bytes.NewReader(body))
                if err != nil {
                    panic(err)
                }
                req.Header.Set("Authorization", "Bearer "+os.Getenv("APIPOD_API_KEY"))
                req.Header.Set("Content-Type", "application/json")

                resp, err := http.DefaultClient.Do(req)
                if err != nil {
                    panic(err)
                }
                defer resp.Body.Close()
                fmt.Println(resp.Status)
            }
        - lang: Rust
          label: Rust
          source: >-
            use reqwest::Client;

            use serde_json::json;

            use std::env;


            #[tokio::main]

            async fn main() -> Result<(), Box<dyn std::error::Error>> {
                let payload = json!({
              "model": "seedance-1.0-lite-i2v-ref",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "duration": 5,
              "image_urls": [
                "https://cdn.example.com/reference-1.jpg"
              ],
              "resolution": "720p",
              "aspect_ratio": "adaptive"
            });
                let response = Client::new()
                    .post("https://api.apipod.ai/v1/videos/generations")
                    .bearer_auth(env::var("APIPOD_API_KEY")?)
                    .json(&payload)
                    .send()
                    .await?
                    .error_for_status()?;

                println!("{}", response.text().await?);
                Ok(())
            }
        - lang: JavaScript
          label: JavaScript
          source: >-
            const response = await
            fetch("https://api.apipod.ai/v1/videos/generations", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(
              {
                "model": "seedance-1.0-lite-i2v-ref",
                "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
                "duration": 5,
                "image_urls": [
                  "https://cdn.example.com/reference-1.jpg"
                ],
                "resolution": "720p",
                "aspect_ratio": "adaptive"
              }
              ),
            });


            if (!response.ok) {
              throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);
            }


            console.log(await response.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: Use your APIPod API key as a Bearer token in the Authorization header.
