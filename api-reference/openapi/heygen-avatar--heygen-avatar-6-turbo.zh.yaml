openapi: 3.1.0
info:
  title: HeyGen Avatar 6 Turbo API
  version: 1.0.0
  description: 用一张人像照片和一段语音生成 1080p 对口型数字人视频，画幅跟随照片、时长跟随音频，可用最多 1200 字符的提示词控制动作与表情。在 APIPod 中的公开模型 ID 为 heygen-avatar-6-turbo。
servers:
  - url: https://api.apipod.ai
    description: 生产环境
paths:
  /v1/videos/generations:
    post:
      summary: 创建生成任务
      description: 传入 1 张人像照片与 1 段语音，输出 1080p 对口型视频。画幅跟随照片（auto），时长跟随输入音频；可选 prompt（最多 1200 字符）描述动作与表情。公开模型 ID 为 heygen-avatar-6-turbo。
      operationId: create-heygen-avatar-heygen-avatar-6-turbo
      tags:
        - HeyGen Avatar 6 Turbo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: HeyGen Avatar 6 Turbo
              properties:
                model:
                  type: string
                  title: 模型 ID
                  description: APIPod 公开模型 ID。
                  const: heygen-avatar-6-turbo
                image_urls:
                  type: array
                  title: 人像照片
                  description: 必填。恰好 1 张公开 HTTPS 人像照片地址，输出画幅自动跟随该照片。
                  items:
                    type: string
                    description: 公开 HTTPS 人像照片地址。
                  minItems: 1
                  maxItems: 1
                audio_urls:
                  type: array
                  title: 驱动语音
                  description: 必填。恰好 1 段公开 HTTPS 语音文件地址（WAV/MP3/M4A），成片时长跟随该音频。
                  items:
                    type: string
                    description: 公开 HTTPS 语音文件地址。
                  minItems: 1
                  maxItems: 1
                prompt:
                  type: string
                  title: 动作与表情提示词
                  description: 可选。最多 1200 字符，用于描述人物姿态、手势动作与面部表情。
                  maxLength: 1200
                resolution:
                  type: string
                  title: 分辨率
                  description: 输出视频分辨率（固定 1080p）。
                  enum:
                    - 1080p
                  default: 1080p
                callback_url:
                  type: string
                  title: 回调地址
                  description: 可选。任务完成后接收异步通知的 Webhook 地址。
              required:
                - model
                - image_urls
                - audio_urls
            example:
              model: heygen-avatar-6-turbo
              image_urls:
                - https://cdn.example.com/portrait.png
              audio_urls:
                - https://cdn.example.com/speech.wav
              prompt: Face the camera and use small, natural hand gestures while speaking.
              resolution: 1080p
      responses:
        "200":
          description: 任务已受理
          content:
            application/json:
              schema:
                type: object
                title: 任务提交响应
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      task_id:
                        type: string
                        description: 生成任务 ID
                  message:
                    type: string
                required:
                  - code
                  - message
                  - data
              example:
                code: 200
                message: success
                data:
                  task_id: vid_task_01JEXAMPLE
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: |-
            curl https://api.apipod.ai/v1/videos/generations \
              -H "Authorization: Bearer $APIPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
              "model": "heygen-avatar-6-turbo",
              "image_urls": ["https://cdn.example.com/portrait.png"],
              "audio_urls": ["https://cdn.example.com/speech.wav"],
              "prompt": "Face the camera and use small, natural hand gestures while speaking.",
              "resolution": "1080p"
            }'
        - lang: Python
          label: Python
          source: |-
            import os, requests

            res = requests.post(
                "https://api.apipod.ai/v1/videos/generations",
                headers={"Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}"},
                json={
                    "model": "heygen-avatar-6-turbo",
                    "image_urls": ["https://cdn.example.com/portrait.png"],
                    "audio_urls": ["https://cdn.example.com/speech.wav"],
                    "prompt": "Face the camera and use small, natural hand gestures while speaking.",
                    "resolution": "1080p",
                },
            )
            print(res.json())
        - lang: JavaScript
          label: JavaScript
          source: |-
            const res = await fetch("https://api.apipod.ai/v1/videos/generations", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                model: "heygen-avatar-6-turbo",
                image_urls: ["https://cdn.example.com/portrait.png"],
                audio_urls: ["https://cdn.example.com/speech.wav"],
                prompt: "Face the camera and use small, natural hand gestures while speaking.",
                resolution: "1080p",
              }),
            });
            console.log(await res.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: APIPod API 密钥（`sk-...`）
