openapi: 3.1.0
info:
  title: GPT Image 2.6 Flare API
  version: 1.0.0
  description: "GPT Image 2.6 Flare is the faster tier of OpenAI's GPT Image 2.6 image family. It
    keeps the 2.5 fidelity tiers and adds three capabilities: looping GIF animation, editable SVG
    vector output and a complexity control that decides how much the model plans before rendering.
    Flare is the default choice when response time matters. In APIPod, the public model ID is
    gpt-image-2.6-flare. It supports text-to-image and reference-image editing, and returns GIF and
    SVG results as stored artifacts."
servers:
  - url: https://api.apipod.ai
    description: Production
paths:
  /v1/images/generations:
    post:
      summary: Create Generation Task
      description: "GPT Image 2.6 Flare is the faster tier of OpenAI's GPT Image 2.6 image family. It
        keeps the 2.5 fidelity tiers and adds three capabilities: looping GIF animation, editable
        SVG vector output and a complexity control that decides how much the model plans before
        rendering. Flare is the default choice when response time matters. In APIPod, the public
        model ID is gpt-image-2.6-flare. It supports text-to-image and reference-image editing, and
        returns GIF and SVG results as stored artifacts."
      operationId: create-gpt-image-2.6-gpt-image-2.6-flare
      tags:
        - GPT Image 2.6 Flare
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: GPT Image 2.6 Flare
              required:
                - model
                - prompt
              properties:
                model:
                  type: string
                  title: Model ID
                  description: Public APIPod model ID.
                  const: gpt-image-2.6-flare
                prompt:
                  type: string
                  title: Prompt
                  maxLength: 32000
                  description: Used to describe the generated images. For GIF output, describe the subject, the motion
                    and how the loop should close.
                image_urls:
                  type: array
                  title: Image Urls
                  maxItems: 16
                  items:
                    type: string
                  description: Publicly reachable source or reference image URLs. Not supported together with gif or
                    svg output.
                output_format:
                  enum:
                    - png
                    - jpeg
                    - webp
                    - gif
                    - svg
                  type: string
                  title: Output Format
                  default: png
                  description: Output format. gif and svg are new in GPT Image 2.6 and are only available for
                    text-to-image; svg returns a single result, and neither format supports
                    output_compression or transparent backgrounds.
                complexity:
                  enum:
                    - low
                    - medium
                    - high
                  type: string
                  title: Complexity
                  default: high
                  description: How much the model plans before rendering. low suits focused edits such as changing a
                    background; high helps with dense text and complex layouts. Defaults to high and
                    costs nothing extra.
                quality:
                  enum:
                    - auto
                    - low
                    - medium
                    - high
                    - xhigh
                    - max
                  type: string
                  title: Quality
                  default: auto
                  description: Output fidelity tier. Must be at least medium when background is transparent.
                background:
                  enum:
                    - auto
                    - opaque
                    - transparent
                  type: string
                  title: Background
                  default: auto
                  description: Background mode. transparent returns an alpha-channel image and requires quality of
                    medium or higher.
                aspect_ratio:
                  enum:
                    - auto
                    - 1:1
                    - 2:3
                    - 3:2
                    - 3:4
                    - 4:3
                    - 4:5
                    - 5:4
                    - 9:16
                    - 16:9
                    - 21:9
                  type: string
                  title: Aspect Ratio
                  default: auto
                  description: Aspect ratio of the generated image.
                resolution:
                  enum:
                    - 1K
                    - 2K
                    - 4K
                  type: string
                  title: Resolution
                  default: 1K
                  description: Resolution tier of the generated images.
                size:
                  type: string
                  title: Size
                  description: Optional escape hatch for exact pixel dimensions, as WIDTHxHEIGHT (for example
                    1024x1536). Each side must be a multiple of 16 and at most 3840. Takes
                    precedence over resolution and aspect_ratio when both are sent. resolution +
                    aspect_ratio already covers the 15 supported ratios at 1K/2K/4K, and works for
                    GIF frames too, so size is only needed for pixel-exact or off-ratio sizes.
                frame_count:
                  type: integer
                  title: Frame Count
                  minimum: 2
                  maximum: 64
                  default: 9
                  description: Number of GIF frames, 2-64. Only read when output_format is gif; defaults to 9.
                frame_duration_ms:
                  type: integer
                  title: Frame Duration (ms)
                  minimum: 20
                  maximum: 2000
                  default: 200
                  description: Duration of each GIF frame in milliseconds, 20-2000. Only read when output_format is
                    gif; defaults to 200.
                output_compression:
                  type: integer
                  title: Output Compression
                  minimum: 0
                  maximum: 100
                  description: Compression level 0-100 for jpeg and webp output. Not supported by gif or svg.
                moderation:
                  enum:
                    - low
                    - auto
                  type: string
                  title: Moderation
                  default: low
                  description: Moderation strictness. APIPod defaults to low for GPT Image 2.6 to reduce false blocks;
                    pass auto to restore OpenAI's default filtering.
                svg:
                  type: object
                  title: SVG Config
                  description: SVG authoring config, only read when output_format=svg. SVG is produced by first
                    rendering a reference bitmap and then having a text model rewrite it as vectors.
                    Omit the whole object to author with the platform default gpt-5.4-mini, or set
                    svg.model to another model with text token pricing.
                  properties:
                    model:
                      type: string
                      title: SVG Model
                      minLength: 1
                      default: gpt-5.4-mini
                      description: Text model that authors the SVG. Must be a model with text token pricing. Defaults to
                        gpt-5.4-mini when omitted.
                    reasoning:
                      type: object
                      title: SVG Reasoning
                      description: Reasoning settings for the SVG author, independent of image complexity. Omit effort to
                        use the author model's default.
                      properties:
                        effort:
                          enum:
                            - none
                            - minimal
                            - low
                            - medium
                            - high
                            - xhigh
                            - max
                          type: string
                          title: Reasoning Effort
                          description: How much effort the SVG author spends on reasoning.
                  x-apipod-ui:
                    component: hidden
            example:
              model: gpt-image-2.6-flare
              prompt: A premium product photograph on a dark studio set, precise typography, soft rim lighting,
                highly detailed.
              quality: auto
              aspect_ratio: auto
              resolution: 1K
      responses:
        "200":
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                title: Task Submit Response
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    title: Task Submit Data
                    properties:
                      task_id:
                        type: string
                        description: generatation task id
                    description: Data content for task submission
                  message:
                    type: string
                description: Standard response for task submission
              example:
                code: 200
                message: success
                data:
                  task_id: img_task_01JEXAMPLE
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl https://api.apipod.ai/v1/images/generations \
              -H "Authorization: Bearer $APIPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
              "model": "gpt-image-2.6-flare",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "quality": "auto",
              "aspect_ratio": "auto",
              "resolution": "1K"
            }'
        - lang: Python
          label: Python
          source: >-
            import os

            import requests


            payload = {
              "model": "gpt-image-2.6-flare",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "quality": "auto",
              "aspect_ratio": "auto",
              "resolution": "1K"
            }


            response = requests.post(
                "https://api.apipod.ai/v1/images/generations",
                headers={
                    "Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}",
                    "Content-Type": "application/json",
                },
                json=payload,
                timeout=60,
            )

            response.raise_for_status()

            print(response.json())
        - lang: Go
          label: Go
          source: >-
            package main


            import (
                "bytes"
                "encoding/json"
                "fmt"
                "net/http"
                "os"
            )


            func main() {
                payload := map[string]any{}
                if err := json.Unmarshal([]byte(`{
              "model": "gpt-image-2.6-flare",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "quality": "auto",
              "aspect_ratio": "auto",
              "resolution": "1K"
            }`), &payload); err != nil {
                    panic(err)
                }
                body, err := json.Marshal(payload)
                if err != nil {
                    panic(err)
                }

                req, err := http.NewRequest(http.MethodPost, "https://api.apipod.ai/v1/images/generations", bytes.NewReader(body))
                if err != nil {
                    panic(err)
                }
                req.Header.Set("Authorization", "Bearer "+os.Getenv("APIPOD_API_KEY"))
                req.Header.Set("Content-Type", "application/json")

                resp, err := http.DefaultClient.Do(req)
                if err != nil {
                    panic(err)
                }
                defer resp.Body.Close()
                fmt.Println(resp.Status)
            }
        - lang: Rust
          label: Rust
          source: >-
            use reqwest::Client;

            use serde_json::json;

            use std::env;


            #[tokio::main]

            async fn main() -> Result<(), Box<dyn std::error::Error>> {
                let payload = json!({
              "model": "gpt-image-2.6-flare",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "quality": "auto",
              "aspect_ratio": "auto",
              "resolution": "1K"
            });
                let response = Client::new()
                    .post("https://api.apipod.ai/v1/images/generations")
                    .bearer_auth(env::var("APIPOD_API_KEY")?)
                    .json(&payload)
                    .send()
                    .await?
                    .error_for_status()?;

                println!("{}", response.text().await?);
                Ok(())
            }
        - lang: JavaScript
          label: JavaScript
          source: >-
            const response = await fetch("https://api.apipod.ai/v1/images/generations", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(
              {
                "model": "gpt-image-2.6-flare",
                "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
                "quality": "auto",
                "aspect_ratio": "auto",
                "resolution": "1K"
              }
              ),
            });


            if (!response.ok) {
              throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);
            }


            console.log(await response.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: Use your APIPod API key as a Bearer token in the Authorization header.
