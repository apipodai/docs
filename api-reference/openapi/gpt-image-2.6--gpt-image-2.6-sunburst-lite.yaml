openapi: 3.1.0
info:
  title: GPT Image 2.6 Sunburst Lite API
  version: 1.0.0
  description: GPT Image 2.6 Sunburst Lite is APIPod's lower-cost routing variant for GPT Image 2.6 Sunburst
    rather than a separate OpenAI model. It uses the shared generation and editing contract through partner
    channels such as Azure and Adobe, suited to high-volume and cost-sensitive work; SVG output is not
    available on this variant. In APIPod, the public model ID is gpt-image-2.6-sunburst-lite. It supports
    text-to-image and reference-image editing.
servers:
- url: https://api.apipod.ai
  description: Production
paths:
  /v1/images/generations:
    post:
      summary: Create Generation Task
      description: GPT Image 2.6 Sunburst Lite is APIPod's lower-cost routing variant for GPT Image 2.6
        Sunburst rather than a separate OpenAI model. It uses the shared generation and editing contract
        through partner channels such as Azure and Adobe, suited to high-volume and cost-sensitive work;
        SVG output is not available on this variant. In APIPod, the public model ID is gpt-image-2.6-sunburst-lite.
        It supports text-to-image and reference-image editing.
      operationId: create-gpt-image-2.6-gpt-image-2.6-sunburst-lite
      tags:
      - GPT Image 2.6 Sunburst Lite
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: GPT Image 2.6 Sunburst Lite
              required:
              - model
              - prompt
              properties:
                model:
                  type: string
                  title: Model ID
                  description: Public APIPod model ID.
                  const: gpt-image-2.6-sunburst-lite
                prompt:
                  type: string
                  title: Prompt
                  maxLength: 32000
                  description: Used to describe the generated images. For GIF output, describe the subject,
                    the motion and how the loop should close.
                image_urls:
                  type: array
                  title: Image Urls
                  maxItems: 16
                  items:
                    type: string
                  description: Publicly reachable source or reference image URLs. Not supported together
                    with gif or svg output.
                mask_url:
                  type: string
                  title: Mask Url
                  description: Inpaint mask image as a public URL or base64 data URI. Transparent pixels
                    mark the region the model may edit; the rest of the image stays unchanged. Requires
                    image_urls and cannot be combined with markup_url.
                markup_url:
                  type: string
                  title: Markup Url
                  description: Markup overlay image as a public URL or base64 data URI. A transparent
                    PNG placed on top of the first reference image whose opaque strokes guide the model
                    to the regions to edit; dimensions must match the first image after orientation. Requires
                    image_urls and cannot be combined with mask_url.
                output_format:
                  enum:
                  - png
                  - jpeg
                  - webp
                  - gif
                  type: string
                  title: Output Format
                  default: png
                  description: Output format. gif is only available for text-to-image and does not support
                    output_compression or transparent backgrounds; svg is not available on GPT Image 2.6
                    Lite.
                complexity:
                  enum:
                  - low
                  - medium
                  - high
                  type: string
                  title: Complexity
                  default: high
                  description: How much the model plans before rendering. low suits focused edits such
                    as changing a background; high helps with dense text and complex layouts. Defaults
                    to high and costs nothing extra.
                quality:
                  enum:
                  - auto
                  - low
                  - medium
                  - high
                  - xhigh
                  - max
                  type: string
                  title: Quality
                  default: auto
                  description: Output fidelity tier. Must be at least medium when background is transparent.
                background:
                  enum:
                  - auto
                  - opaque
                  - transparent
                  type: string
                  title: Background
                  default: auto
                  description: Background mode. transparent returns an alpha-channel image and requires
                    quality of medium or higher.
                aspect_ratio:
                  enum:
                  - auto
                  - 61
                  - 123
                  - 182
                  - 184
                  - 243
                  - 245
                  - 304
                  - 556
                  - 969
                  - 1269
                  type: string
                  title: Aspect Ratio
                  default: auto
                  description: Aspect ratio of the generated image.
                resolution:
                  enum:
                  - 1K
                  - 2K
                  - 4K
                  type: string
                  title: Resolution
                  default: 1K
                  description: Resolution tier of the generated images.
                size:
                  type: string
                  title: Size
                  description: Optional escape hatch for exact pixel dimensions, as WIDTHxHEIGHT (for
                    example 1024x1536). Each side must be a multiple of 16 and at most 3840. Takes precedence
                    over resolution and aspect_ratio when both are sent. resolution + aspect_ratio already
                    covers the 15 supported ratios at 1K/2K/4K, and works for GIF frames too, so size
                    is only needed for pixel-exact or off-ratio sizes.
                frame_count:
                  type: integer
                  title: Frame Count
                  minimum: 2
                  maximum: 64
                  default: 9
                  description: Number of GIF frames, 2-64. Only read when output_format is gif; defaults
                    to 9.
                frame_duration_ms:
                  type: integer
                  title: Frame Duration (ms)
                  minimum: 20
                  maximum: 2000
                  default: 200
                  description: Duration of each GIF frame in milliseconds, 20-2000. Only read when output_format
                    is gif; defaults to 200.
                output_compression:
                  type: integer
                  title: Output Compression
                  minimum: 0
                  maximum: 100
                  description: Compression level 0-100 for jpeg and webp output. Not supported by gif
                    or svg.
                moderation:
                  enum:
                  - low
                  - auto
                  type: string
                  title: Moderation
                  default: low
                  description: Moderation strictness. APIPod defaults to low for GPT Image 2.6 to reduce
                    false blocks; pass auto to restore OpenAI's default filtering.
                svg:
                  type: object
                  title: SVG Config
                  description: SVG authoring config, only read when output_format=svg. SVG is produced
                    by first rendering a reference bitmap and then having a text model rewrite it as vectors.
                    Omit the whole object to author with the platform default gpt-5.4-mini, or set svg.model
                    to another model with text token pricing.
                  properties:
                    model:
                      type: string
                      title: SVG Model
                      minLength: 1
                      default: gpt-5.4-mini
                      description: Text model that authors the SVG. Must be a model with text token pricing.
                        Defaults to gpt-5.4-mini when omitted.
                    reasoning:
                      type: object
                      title: SVG Reasoning
                      description: Reasoning settings for the SVG author, independent of image complexity.
                        Omit effort to use the author model's default.
                      properties:
                        effort:
                          enum:
                          - none
                          - minimal
                          - low
                          - medium
                          - high
                          - xhigh
                          - max
                          type: string
                          title: Reasoning Effort
                          description: How much effort the SVG author spends on reasoning.
                  x-apipod-ui:
                    component: hidden
            example:
              model: gpt-image-2.6-sunburst-lite
              prompt: A premium product photograph on a dark studio set, precise typography, soft rim
                lighting, highly detailed.
              quality: auto
              aspect_ratio: auto
              resolution: 1K
      responses:
        '200':
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                title: Task Submit Response
                required:
                - code
                - message
                - data
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    title: Task Submit Data
                    properties:
                      task_id:
                        type: string
                        description: generatation task id
                    description: Data content for task submission
                  message:
                    type: string
                description: Standard response for task submission
              example:
                code: 200
                message: success
                data:
                  task_id: img_task_01JEXAMPLE
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: "curl https://api.apipod.ai/v1/images/generations \\\n  -H \"Authorization: Bearer $APIPOD_API_KEY\"\
          \ \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n  \"model\": \"gpt-image-2.6-sunburst-lite\"\
          ,\n  \"prompt\": \"A premium product photograph on a dark studio set, precise typography, soft\
          \ rim lighting, highly detailed.\",\n  \"quality\": \"auto\",\n  \"aspect_ratio\": \"auto\"\
          ,\n  \"resolution\": \"1K\"\n}'"
      - lang: Python
        label: Python
        source: "import os\nimport requests\n\npayload = {\n  \"model\": \"gpt-image-2.6-sunburst-lite\"\
          ,\n  \"prompt\": \"A premium product photograph on a dark studio set, precise typography, soft\
          \ rim lighting, highly detailed.\",\n  \"quality\": \"auto\",\n  \"aspect_ratio\": \"auto\"\
          ,\n  \"resolution\": \"1K\"\n}\n\nresponse = requests.post(\n    \"https://api.apipod.ai/v1/images/generations\"\
          ,\n    headers={\n        \"Authorization\": f\"Bearer {os.environ['APIPOD_API_KEY']}\",\n \
          \       \"Content-Type\": \"application/json\",\n    },\n    json=payload,\n    timeout=60,\n\
          )\nresponse.raise_for_status()\nprint(response.json())"
      - lang: Go
        label: Go
        source: "package main\n\nimport (\n    \"bytes\"\n    \"encoding/json\"\n    \"fmt\"\n    \"net/http\"\
          \n    \"os\"\n)\n\nfunc main() {\n    payload := map[string]any{}\n    if err := json.Unmarshal([]byte(`{\n\
          \  \"model\": \"gpt-image-2.6-sunburst-lite\",\n  \"prompt\": \"A premium product photograph\
          \ on a dark studio set, precise typography, soft rim lighting, highly detailed.\",\n  \"quality\"\
          : \"auto\",\n  \"aspect_ratio\": \"auto\",\n  \"resolution\": \"1K\"\n}`), &payload); err !=\
          \ nil {\n        panic(err)\n    }\n    body, err := json.Marshal(payload)\n    if err != nil\
          \ {\n        panic(err)\n    }\n\n    req, err := http.NewRequest(http.MethodPost, \"https://api.apipod.ai/v1/images/generations\"\
          , bytes.NewReader(body))\n    if err != nil {\n        panic(err)\n    }\n    req.Header.Set(\"\
          Authorization\", \"Bearer \"+os.Getenv(\"APIPOD_API_KEY\"))\n    req.Header.Set(\"Content-Type\"\
          , \"application/json\")\n\n    resp, err := http.DefaultClient.Do(req)\n    if err != nil {\n\
          \        panic(err)\n    }\n    defer resp.Body.Close()\n    fmt.Println(resp.Status)\n}"
      - lang: Rust
        label: Rust
        source: "use reqwest::Client;\nuse serde_json::json;\nuse std::env;\n\n#[tokio::main]\nasync fn\
          \ main() -> Result<(), Box<dyn std::error::Error>> {\n    let payload = json!({\n  \"model\"\
          : \"gpt-image-2.6-sunburst-lite\",\n  \"prompt\": \"A premium product photograph on a dark studio\
          \ set, precise typography, soft rim lighting, highly detailed.\",\n  \"quality\": \"auto\",\n\
          \  \"aspect_ratio\": \"auto\",\n  \"resolution\": \"1K\"\n});\n    let response = Client::new()\n\
          \        .post(\"https://api.apipod.ai/v1/images/generations\")\n        .bearer_auth(env::var(\"\
          APIPOD_API_KEY\")?)\n        .json(&payload)\n        .send()\n        .await?\n        .error_for_status()?;\n\
          \n    println!(\"{}\", response.text().await?);\n    Ok(())\n}"
      - lang: JavaScript
        label: JavaScript
        source: "const response = await fetch(\"https://api.apipod.ai/v1/images/generations\", {\n  method:\
          \ \"POST\",\n  headers: {\n    Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,\n    \"\
          Content-Type\": \"application/json\",\n  },\n  body: JSON.stringify(\n  {\n    \"model\": \"\
          gpt-image-2.6-sunburst-lite\",\n    \"prompt\": \"A premium product photograph on a dark studio\
          \ set, precise typography, soft rim lighting, highly detailed.\",\n    \"quality\": \"auto\"\
          ,\n    \"aspect_ratio\": \"auto\",\n    \"resolution\": \"1K\"\n  }\n  ),\n});\n\nif (!response.ok)\
          \ {\n  throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);\n\
          }\n\nconsole.log(await response.json());"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: Use your APIPod API key as a Bearer token in the Authorization header.
