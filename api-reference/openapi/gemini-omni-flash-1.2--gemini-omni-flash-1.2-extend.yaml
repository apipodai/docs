openapi: 3.1.0
info:
  title: Gemini Omni Flash 1.2 Video Extend API
  version: 1.0.0
  description: Gemini Omni Flash 1.2 continues one source video of up to 15
    seconds by another 3-10 seconds, following the prompt with synchronized
    audio. In APIPod, the public model ID is gemini-omni-flash-1.2-extend. It
    supports video-to-video, accepts text and video inputs, and returns results
    through asynchronous video tasks.
servers:
  - url: https://api.apipod.ai
    description: Production
paths:
  /v1/videos/generations:
    post:
      summary: Create Generation Task
      description: Gemini Omni Flash 1.2 continues one source video of up to 15
        seconds by another 3-10 seconds, following the prompt with synchronized
        audio. In APIPod, the public model ID is gemini-omni-flash-1.2-extend.
        It supports video-to-video, accepts text and video inputs, and returns
        results through asynchronous video tasks.
      operationId: create-gemini-omni-flash-1.2-gemini-omni-flash-1.2-extend
      tags:
        - Gemini Omni Flash 1.2 Video Extend
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Gemini Omni Flash 1.2 Video Extend
              properties:
                model:
                  type: string
                  title: Model ID
                  description: Public APIPod model ID.
                  const: gemini-omni-flash-1.2-extend
                prompt:
                  type: string
                  title: Prompt
                  description: Required. Text description of the video, up to 50000 characters.
                  minLength: 1
                  maxLength: 50000
                video_urls:
                  type: array
                  title: Source Video
                  description: Exactly one source video to extend (up to 15 seconds, 64MB, mp4 /
                    mov / webm).
                  items:
                    type: string
                duration:
                  type: integer
                  title: Extension Duration
                  description: Seconds to add after the source video, 3-10. Billing counts the
                    source video seconds plus the added seconds.
                  default: 3
                  minimum: 3
                  maximum: 10
                resolution:
                  type: string
                  title: Resolution
                  description: Output resolution.
                  enum:
                    - 360p
                    - 720p
                    - 1080p
                    - 4k
                  default: 360p
              required:
                - model
                - prompt
                - video_urls
            example:
              model: gemini-omni-flash-1.2-extend
              prompt: A cinematic tracking shot through a rain-soaked neon street, realistic
                motion, synchronized ambient sound.
              video_urls:
                - https://cdn.example.com/reference.mp4
              duration: 3
              resolution: 360p
      responses:
        "200":
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                title: Task Submit Response
                description: Standard response for task submission
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    title: Task Submit Data
                    description: Data content for task submission
                    properties:
                      task_id:
                        type: string
                        description: generatation task id
                  message:
                    type: string
                required:
                  - code
                  - message
                  - data
              example:
                code: 200
                message: success
                data:
                  task_id: vid_task_01JEXAMPLE
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl https://api.apipod.ai/v1/videos/generations \
              -H "Authorization: Bearer $APIPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
              "model": "gemini-omni-flash-1.2-extend",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "video_urls": [
                "https://cdn.example.com/reference.mp4"
              ],
              "duration": 3,
              "resolution": "360p"
            }'
        - lang: Python
          label: Python
          source: >-
            import os

            import requests


            payload = {
              "model": "gemini-omni-flash-1.2-extend",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "video_urls": [
                "https://cdn.example.com/reference.mp4"
              ],
              "duration": 3,
              "resolution": "360p"
            }


            response = requests.post(
                "https://api.apipod.ai/v1/videos/generations",
                headers={
                    "Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}",
                    "Content-Type": "application/json",
                },
                json=payload,
                timeout=60,
            )

            response.raise_for_status()

            print(response.json())
        - lang: Go
          label: Go
          source: >-
            package main


            import (
                "bytes"
                "encoding/json"
                "fmt"
                "net/http"
                "os"
            )


            func main() {
                payload := map[string]any{}
                if err := json.Unmarshal([]byte(`{
              "model": "gemini-omni-flash-1.2-extend",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "video_urls": [
                "https://cdn.example.com/reference.mp4"
              ],
              "duration": 3,
              "resolution": "360p"
            }`), &payload); err != nil {
                    panic(err)
                }
                body, err := json.Marshal(payload)
                if err != nil {
                    panic(err)
                }

                req, err := http.NewRequest(http.MethodPost, "https://api.apipod.ai/v1/videos/generations", bytes.NewReader(body))
                if err != nil {
                    panic(err)
                }
                req.Header.Set("Authorization", "Bearer "+os.Getenv("APIPOD_API_KEY"))
                req.Header.Set("Content-Type", "application/json")

                resp, err := http.DefaultClient.Do(req)
                if err != nil {
                    panic(err)
                }
                defer resp.Body.Close()
                fmt.Println(resp.Status)
            }
        - lang: Rust
          label: Rust
          source: >-
            use reqwest::Client;

            use serde_json::json;

            use std::env;


            #[tokio::main]

            async fn main() -> Result<(), Box<dyn std::error::Error>> {
                let payload = json!({
              "model": "gemini-omni-flash-1.2-extend",
              "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
              "video_urls": [
                "https://cdn.example.com/reference.mp4"
              ],
              "duration": 3,
              "resolution": "360p"
            });
                let response = Client::new()
                    .post("https://api.apipod.ai/v1/videos/generations")
                    .bearer_auth(env::var("APIPOD_API_KEY")?)
                    .json(&payload)
                    .send()
                    .await?
                    .error_for_status()?;

                println!("{}", response.text().await?);
                Ok(())
            }
        - lang: JavaScript
          label: JavaScript
          source: >-
            const response = await
            fetch("https://api.apipod.ai/v1/videos/generations", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(
              {
                "model": "gemini-omni-flash-1.2-extend",
                "prompt": "A cinematic tracking shot through a rain-soaked neon street, realistic motion, synchronized ambient sound.",
                "video_urls": [
                  "https://cdn.example.com/reference.mp4"
                ],
                "duration": 3,
                "resolution": "360p"
              }
              ),
            });


            if (!response.ok) {
              throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);
            }


            console.log(await response.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: Use your APIPod API key as a Bearer token in the Authorization header.
