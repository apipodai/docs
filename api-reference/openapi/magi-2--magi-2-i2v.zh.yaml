openapi: 3.1.0
info:
  title: MAGI-2 图生视频 API
  version: 1.0.0
  description: Sand AI MAGI-2 图生视频支持首帧与可选尾帧输入，单次生成 4-30 秒 1080p、25 fps 原生有声视频。在 APIPod 中，公开模型 ID 为 magi-2-i2v。
servers:
  - url: https://api.apipod.ai
    description: 生产环境
paths:
  /v1/videos/generations:
    post:
      summary: 创建视频生成任务
      description: Sand AI MAGI-2 图生视频支持首帧与可选尾帧输入，提示词可用 @first_frame 与 @last_frame 引用。公开模型 ID 为 magi-2-i2v。
      operationId: create-magi-2-magi-2-i2v
      tags:
        - MAGI-2 图生视频
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: MAGI-2 图生视频
              properties:
                model:
                  type: string
                  title: 模型 ID
                  description: APIPod 公开模型 ID。
                  const: magi-2-i2v
                prompt:
                  type: string
                  title: 提示词
                  description: 必填，最多 8000 个字符；支持 @first_frame 与 @last_frame 引用。
                  minLength: 1
                  maxLength: 8000
                image_urls:
                  type: array
                  title: 首尾帧图片
                  description: 必填，1-2 个公开 HTTPS 图片地址（第 1 张首帧，第 2 张可选尾帧）。
                  items:
                    type: string
                    description: 公开 HTTPS 图片 URL（<30 MB、<=1600 万像素、边长 16-10000 px）。
                  minItems: 1
                  maxItems: 2
                duration:
                  type: integer
                  title: 时长（秒）
                  description: 输出视频秒数，取值 4-30，默认 5。
                  minimum: 4
                  maximum: 30
                  default: 5
                resolution:
                  type: string
                  title: 分辨率
                  description: 输出分辨率，仅支持 1080p。
                  enum:
                    - 1080p
                  default: 1080p
                aspect_ratio:
                  type: string
                  title: 画幅
                  description: 输出画幅，不会自动跟随首帧，请显式设为与首帧一致的比例。
                  enum:
                    - 21:9
                    - 16:9
                    - 4:3
                    - 1:1
                    - 3:4
                    - 9:16
                  default: 16:9
                generate_audio:
                  type: boolean
                  title: 生成音频
                  description: 是否随视频同步生成原生音频，默认 true。
                  default: true
                callback_url:
                  type: string
                  title: 回调地址
                  description: 可选，任务终态 Webhook 回调地址。
              required:
                - model
                - prompt
                - image_urls
            example:
              model: magi-2-i2v
              prompt: 从 @first_frame 开始镜头缓慢推进，晨光扫过工作室桌面并平稳过渡到 @last_frame。
              image_urls:
                - https://cdn.example.com/studio-start.png
                - https://cdn.example.com/studio-end.png
              duration: 8
              resolution: 1080p
              aspect_ratio: "16:9"
              generate_audio: true
      responses:
        "200":
          description: 任务已受理
          content:
            application/json:
              schema:
                type: object
                title: 任务提交响应
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    properties:
                      task_id:
                        type: string
                        description: 生成任务 ID
                  message:
                    type: string
                required:
                  - code
                  - message
                  - data
              example:
                code: 200
                message: success
                data:
                  task_id: vid_task_01JEXAMPLE
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl https://api.apipod.ai/v1/videos/generations \
              -H "Authorization: Bearer $APIPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
              "model": "magi-2-i2v",
              "prompt": "从 @first_frame 开始镜头缓慢推进，晨光扫过工作室桌面并平稳过渡到 @last_frame。",
              "image_urls": [
                "https://cdn.example.com/studio-start.png",
                "https://cdn.example.com/studio-end.png"
              ],
              "duration": 8,
              "resolution": "1080p",
              "aspect_ratio": "16:9",
              "generate_audio": true
            }'
        - lang: Python
          label: Python
          source: >-
            import os
            import requests

            response = requests.post(
                "https://api.apipod.ai/v1/videos/generations",
                headers={
                    "Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}",
                    "Content-Type": "application/json",
                },
                json={
                    "model": "magi-2-i2v",
                    "prompt": "从 @first_frame 开始镜头缓慢推进，晨光扫过工作室桌面。",
                    "image_urls": ["https://cdn.example.com/studio-start.png"],
                    "duration": 8,
                    "resolution": "1080p",
                    "aspect_ratio": "16:9",
                    "generate_audio": True,
                },
                timeout=60,
            )
            response.raise_for_status()
            print(response.json())
        - lang: JavaScript
          label: Node.js
          source: >-
            const response = await fetch("https://api.apipod.ai/v1/videos/generations", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                model: "magi-2-i2v",
                prompt: "从 @first_frame 开始镜头缓慢推进，晨光扫过工作室桌面。",
                image_urls: ["https://cdn.example.com/studio-start.png"],
                duration: 8,
                resolution: "1080p",
                aspect_ratio: "16:9",
                generate_audio: true,
              }),
            });

            if (!response.ok) {
              throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);
            }

            console.log(await response.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: 在 Authorization 请求头中以 Bearer Token 形式携带您的 APIPod API Key。
