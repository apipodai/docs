openapi: 3.1.0
info:
  title: Kling 3.0 Image to Video API
  version: 1.0.0
  description: Kling 3.0 I2V is APIPod's first/last-frame image-to-video mode for Kling 3.0,
    Kuaishou's video model with multi-shot storytelling, reusable subject elements, and optional
    native audio. In APIPod, the public model ID is kling-3.0-i2v. It requires a first frame,
    accepts an optional last frame, and returns results through asynchronous video tasks.
servers:
  - url: https://api.apipod.ai
    description: Production
paths:
  /v1/videos/generations:
    post:
      summary: Create Generation Task
      description: Kling 3.0 I2V is APIPod's first/last-frame image-to-video mode for Kling 3.0,
        Kuaishou's video model with multi-shot storytelling, reusable subject elements, and optional
        native audio. In APIPod, the public model ID is kling-3.0-i2v. It requires a first frame,
        accepts an optional last frame, and returns results through asynchronous video tasks.
      operationId: create-kling-3.0-kling-3.0-i2v
      tags:
        - Kling 3.0 Image to Video
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Kling 3.0 Image to Video
              properties:
                model:
                  type: string
                  title: Model ID
                  description: Public APIPod model ID.
                  const: kling-3.0-i2v
                prompt:
                  type: string
                  title: Prompt
                  description: Text prompt describing the motion, up to 2,500 characters. Required unless
                    `multi_prompt` is provided. Reference `kling_elements` with `@name`.
                  maxLength: 2500
                image_urls:
                  type: array
                  title: Image Urls
                  description: Optional first/last frame images; not required when `kling_elements` is used.
                    With `multi_shot` off, 2 images are the first and last frame (index 0 and 1)
                    and 1 image is the first frame; with `multi_shot` on, only a first frame is
                    supported. `first_frame_image` / `last_frame_image` are accepted as aliases. The
                    aspect ratio follows the first frame.
                  maxItems: 2
                  items:
                    type: string
                aspect_ratio:
                  type: string
                  title: Aspect Ratio
                  description: Output aspect ratio, used only when no frame image is provided (for example
                    when only `kling_elements` are used). With a first frame the output follows the
                    image and this field is ignored. Defaults to 16:9.
                  enum:
                    - 16:9
                    - 9:16
                    - 1:1
                  default: 16:9
                duration:
                  type: integer
                  title: Duration
                  description: Output duration in seconds (3-15). Defaults to 5; in multi-shot mode it defaults to the
                    sum of the shot durations when omitted.
                  minimum: 3
                  maximum: 15
                  default: 5
                resolution:
                  type: string
                  title: Resolution
                  description: Output resolution (up to 4K). Defaults to 720p. The per-second rate depends on the
                    resolution and, for 720p and 1080p, on native audio.
                  enum:
                    - 720p
                    - 1080p
                    - 4k
                  default: 720p
                generate_audio:
                  type: boolean
                  title: Generate Audio
                  description: Generate native audio (alias `audio`). Defaults to false for single-shot requests and
                    true for multi-shot requests.
                multi_shot:
                  type: boolean
                  title: Multi Shot
                  description: Enable multi-shot generation (alias `multi_shots`). Use together with `multi_prompt` to
                    define each shot.
                multi_prompt:
                  type: array
                  title: Multi Prompt
                  description: Shot list for multi-shot generation, up to 5 shots. Each shot is `{prompt, duration}`
                    with a prompt of up to 500 characters and a duration of 1-12 seconds; the total
                    must not exceed `duration`.
                  maxItems: 5
                  items:
                    type: object
                    properties:
                      prompt:
                        type: string
                        description: Shot description, up to 500 characters.
                        maxLength: 500
                      duration:
                        type: integer
                        description: Shot duration in seconds (1-12).
                        minimum: 1
                        maximum: 12
                    required:
                      - prompt
                      - duration
                kling_elements:
                  type: array
                  title: Kling Elements
                  description: Reusable subject elements (up to 3). Each element has a `name`, a `description` and 2-4
                    reference images in `element_input_urls`. Reference an element in the prompt
                    with `@name`; each reference counts as 37 characters toward the prompt length.
                  maxItems: 3
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: Element name, referenced in the prompt as `@name`.
                      description:
                        type: string
                        description: Short description of the element.
                      element_input_urls:
                        type: array
                        title: Character Media
                        description: Either 2-4 publicly accessible image URLs of the subject, or exactly
                          one video URL for a video character subject. Images and video cannot be mixed.
                        minItems: 1
                        maxItems: 4
                        items:
                          type: string
                      element_input_audio_urls:
                        type: array
                        title: Voice or Sound Reference
                        description: Optional audio URL that guides the element's voice, tone or sound.
                          The audio must be 5-30 seconds long.
                        maxItems: 1
                        items:
                          type: string
                      start_time:
                        type: integer
                        title: Clip Start
                        description: Start of the clip window in milliseconds, for a video character
                          subject only. Defaults to 0.
                        minimum: 0
                      end_time:
                        type: integer
                        title: Clip End
                        description: End of the clip window in milliseconds, for a video character
                          subject only. Must exceed `start_time`, and the window must span 3000-8000 ms.
                        minimum: 3000
                    required:
                      - name
                      - description
                      - element_input_urls
                callback_url:
                  type: string
                  title: Callback URL
                  description: HTTPS URL that receives the task's terminal state.
                  default: ""
              required:
                - model
            examples:
              basic:
                summary: First and last frame
                value:
                  model: kling-3.0-i2v
                  prompt: The camera slowly pushes in as the dancer spins and lands in the final pose.
                  image_urls:
                    - https://cdn.example.com/first-frame.jpg
                    - https://cdn.example.com/last-frame.jpg
                  duration: 5
                  resolution: 1080p
                  generate_audio: false
              multi_shot:
                summary: Multi-shot from a first frame
                value:
                  model: kling-3.0-i2v
                  image_urls:
                    - https://cdn.example.com/first-frame.jpg
                  multi_shot: true
                  multi_prompt:
                    - prompt: "Wide shot: a lighthouse on a rocky cliff at dawn, waves crashing below."
                      duration: 2
                    - prompt: "Close-up: the lighthouse keeper opens the door and looks at the sea."
                      duration: 3
                  duration: 5
                  resolution: 720p
              elements:
                summary: First frame with kling_elements
                value:
                  model: kling-3.0-i2v
                  prompt: "@robot rolls into the room and hands a flower to the girl."
                  image_urls:
                    - https://cdn.example.com/first-frame.jpg
                  kling_elements:
                    - name: robot
                      description: A small round white robot
                      element_input_urls:
                        - https://cdn.example.com/kling-ref-1.jpg
                        - https://cdn.example.com/kling-ref-2.jpg
                        - https://cdn.example.com/kling-ref-3.jpg
                  duration: 5
                  resolution: 720p
      responses:
        "200":
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                title: Task Submit Response
                description: Standard response for task submission
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    title: Task Submit Data
                    description: Data content for task submission
                    properties:
                      task_id:
                        type: string
                        description: Task ID used to query the task status.
                  message:
                    type: string
                required:
                  - code
                  - message
                  - data
              example:
                code: 200
                message: success
                data:
                  task_id: vid_task_01JEXAMPLE
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl https://api.apipod.ai/v1/videos/generations \
              -H "Authorization: Bearer $APIPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
              "model": "kling-3.0-i2v",
              "prompt": "The camera slowly pushes in as the dancer spins and lands in the final pose.",
              "image_urls": [
                "https://cdn.example.com/first-frame.jpg",
                "https://cdn.example.com/last-frame.jpg"
              ],
              "duration": 5,
              "resolution": "1080p",
              "generate_audio": false
            }'
        - lang: Python
          label: Python
          source: >-
            import os

            import requests


            payload = {
              "model": "kling-3.0-i2v",
              "prompt": "The camera slowly pushes in as the dancer spins and lands in the final pose.",
              "image_urls": [
                "https://cdn.example.com/first-frame.jpg",
                "https://cdn.example.com/last-frame.jpg"
              ],
              "duration": 5,
              "resolution": "1080p",
              "generate_audio": False
            }


            response = requests.post(
                "https://api.apipod.ai/v1/videos/generations",
                headers={
                    "Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}",
                    "Content-Type": "application/json",
                },
                json=payload,
                timeout=60,
            )

            response.raise_for_status()

            print(response.json())
        - lang: Go
          label: Go
          source: >-
            package main


            import (
                "bytes"
                "fmt"
                "io"
                "net/http"
                "os"
            )


            func main() {
                body := []byte(`{
              "model": "kling-3.0-i2v",
              "prompt": "The camera slowly pushes in as the dancer spins and lands in the final pose.",
              "image_urls": [
                "https://cdn.example.com/first-frame.jpg",
                "https://cdn.example.com/last-frame.jpg"
              ],
              "duration": 5,
              "resolution": "1080p",
              "generate_audio": false
            }`)

                req, err := http.NewRequest(http.MethodPost, "https://api.apipod.ai/v1/videos/generations", bytes.NewReader(body))
                if err != nil {
                    panic(err)
                }
                req.Header.Set("Authorization", "Bearer "+os.Getenv("APIPOD_API_KEY"))
                req.Header.Set("Content-Type", "application/json")

                resp, err := http.DefaultClient.Do(req)
                if err != nil {
                    panic(err)
                }
                defer resp.Body.Close()
                out, _ := io.ReadAll(resp.Body)
                fmt.Println(resp.Status, string(out))
            }
        - lang: Rust
          label: Rust
          source: >-
            use reqwest::Client;

            use serde_json::json;

            use std::env;


            #[tokio::main]

            async fn main() -> Result<(), Box<dyn std::error::Error>> {
                let payload = json!({
                  "model": "kling-3.0-i2v",
                  "prompt": "The camera slowly pushes in as the dancer spins and lands in the final pose.",
                  "image_urls": [
                    "https://cdn.example.com/first-frame.jpg",
                    "https://cdn.example.com/last-frame.jpg"
                  ],
                  "duration": 5,
                  "resolution": "1080p",
                  "generate_audio": false
                });
                let response = Client::new()
                    .post("https://api.apipod.ai/v1/videos/generations")
                    .bearer_auth(env::var("APIPOD_API_KEY")?)
                    .json(&payload)
                    .send()
                    .await?
                    .error_for_status()?;

                println!("{}", response.text().await?);
                Ok(())
            }
        - lang: JavaScript
          label: JavaScript
          source: >-
            const response = await fetch("https://api.apipod.ai/v1/videos/generations", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                "model": "kling-3.0-i2v",
                "prompt": "The camera slowly pushes in as the dancer spins and lands in the final pose.",
                "image_urls": [
                  "https://cdn.example.com/first-frame.jpg",
                  "https://cdn.example.com/last-frame.jpg"
                ],
                "duration": 5,
                "resolution": "1080p",
                "generate_audio": false
              }),
            });


            if (!response.ok) {
              throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);
            }


            console.log(await response.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: Use your APIPod API key as a Bearer token in the Authorization header.
