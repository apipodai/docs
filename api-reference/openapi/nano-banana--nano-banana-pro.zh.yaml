openapi: 3.1.0
info:
  title: Nano Banana Pro API
  version: 1.0.0
  description: Nano Banana Pro 是 Google Gemini
    图片系列中面向复杂创作的高质量模型，强调多模态推理、现实世界知识、精细文字渲染、多图融合和高分辨率输出。在 APIPod 中，公开模型 ID 为
    nano-banana-pro，支持文生图、图片生成与编辑；接受文本、图片输入，并通过异步图片任务返回结果。
servers:
  - url: https://api.apipod.ai
    description: 生产环境
paths:
  /v1/images/generations:
    post:
      summary: 创建生成任务
      description: Nano Banana Pro 是 Google Gemini
        图片系列中面向复杂创作的高质量模型，强调多模态推理、现实世界知识、精细文字渲染、多图融合和高分辨率输出。在 APIPod 中，公开模型 ID 为
        nano-banana-pro，支持文生图、图片生成与编辑；接受文本、图片输入，并通过异步图片任务返回结果。
      operationId: create-nano-banana-nano-banana-pro
      tags:
        - Nano Banana Pro
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  description: APIPod 公开模型 ID。
                  const: nano-banana-pro
                prompt:
                  type: string
                  description: 描述要创建的图片或要执行的编辑。 最大字符串长度：4000。
                image_urls:
                  type: array
                  items:
                    type: string
                  description: 用于编辑、构图或保持主体一致性的参考图片。 最多项目数：8。
                aspect_ratio:
                  type: string
                  description: 输出宽高比。
                  default: auto
                  enum:
                    - auto
                    - 1:1
                    - 2:3
                    - 3:2
                    - 3:4
                    - 4:3
                    - 4:5
                    - 5:4
                    - 16:9
                    - 9:16
                    - 21:9
                quality:
                  type: string
                  description: 输出分辨率档位。
                  default: 1K
                  enum:
                    - 1K
                    - 2K
                    - 4K
                resolution:
                  type: string
                  description: 输出分辨率档位的兼容别名。
                  enum:
                    - 1K
                    - 2K
                    - 4K
                google_search:
                  type: boolean
                  description: 所选通道支持时，允许模型使用 Google Search 联网增强。
                  default: false
                callback_url:
                  type: string
                  description: 接收任务完成通知的 HTTPS 地址。
              required:
                - model
                - prompt
            example:
              model: nano-banana-pro
              prompt: A premium product photograph on a dark studio set, precise typography,
                soft rim lighting, highly detailed.
              aspect_ratio: 16:9
              quality: 1K
              resolution: 2K
      responses:
        "200":
          description: 任务已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: HTTP 状态码。
                    const: 200
                  message:
                    type: string
                    description: 响应消息。
                    const: success
                  data:
                    type: object
                    properties:
                      task_id:
                        type: string
                        description: 用于查询任务状态的 APIPod 任务 ID。
                    required:
                      - task_id
                    description: 响应数据。
                required:
                  - code
                  - message
                  - data
              example:
                code: 200
                message: success
                data:
                  task_id: img_task_01JEXAMPLE
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl https://api.apipod.ai/v1/images/generations \
              -H "Authorization: Bearer $APIPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
              "model": "nano-banana-pro",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "aspect_ratio": "16:9",
              "quality": "1K",
              "resolution": "2K"
            }'
        - lang: Python
          label: Python
          source: >-
            import os

            import requests


            payload = {
              "model": "nano-banana-pro",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "aspect_ratio": "16:9",
              "quality": "1K",
              "resolution": "2K"
            }


            response = requests.post(
                "https://api.apipod.ai/v1/images/generations",
                headers={
                    "Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}",
                    "Content-Type": "application/json",
                },
                json=payload,
                timeout=60,
            )

            response.raise_for_status()

            print(response.json())
        - lang: Go
          label: Go
          source: >-
            package main


            import (
                "bytes"
                "encoding/json"
                "fmt"
                "net/http"
                "os"
            )


            func main() {
                payload := map[string]any{}
                if err := json.Unmarshal([]byte(`{
              "model": "nano-banana-pro",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "aspect_ratio": "16:9",
              "quality": "1K",
              "resolution": "2K"
            }`), &payload); err != nil {
                    panic(err)
                }
                body, err := json.Marshal(payload)
                if err != nil {
                    panic(err)
                }

                req, err := http.NewRequest(http.MethodPost, "https://api.apipod.ai/v1/images/generations", bytes.NewReader(body))
                if err != nil {
                    panic(err)
                }
                req.Header.Set("Authorization", "Bearer "+os.Getenv("APIPOD_API_KEY"))
                req.Header.Set("Content-Type", "application/json")

                resp, err := http.DefaultClient.Do(req)
                if err != nil {
                    panic(err)
                }
                defer resp.Body.Close()
                fmt.Println(resp.Status)
            }
        - lang: Rust
          label: Rust
          source: >-
            use reqwest::Client;

            use serde_json::json;

            use std::env;


            #[tokio::main]

            async fn main() -> Result<(), Box<dyn std::error::Error>> {
                let payload = json!({
              "model": "nano-banana-pro",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "aspect_ratio": "16:9",
              "quality": "1K",
              "resolution": "2K"
            });
                let response = Client::new()
                    .post("https://api.apipod.ai/v1/images/generations")
                    .bearer_auth(env::var("APIPOD_API_KEY")?)
                    .json(&payload)
                    .send()
                    .await?
                    .error_for_status()?;

                println!("{}", response.text().await?);
                Ok(())
            }
        - lang: JavaScript
          label: JavaScript
          source: >-
            const response = await
            fetch("https://api.apipod.ai/v1/images/generations", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(
              {
                "model": "nano-banana-pro",
                "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
                "aspect_ratio": "16:9",
                "quality": "1K",
                "resolution": "2K"
              }
              ),
            });


            if (!response.ok) {
              throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);
            }


            console.log(await response.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: 在 Authorization 请求头中使用 Bearer APIPod_API_KEY。
