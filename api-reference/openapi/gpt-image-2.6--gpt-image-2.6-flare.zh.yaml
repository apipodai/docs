openapi: 3.1.0
info:
  title: GPT Image 2.6 Flare API
  version: 1.0.0
  description: GPT Image 2.6 Flare 是 OpenAI GPT Image 2.6 图片系列中注重速度的档位。它保留 2.5 的保真档位，并新增三项能力：循环 GIF
    动画、可编辑的 SVG 矢量输出，以及决定模型渲染前规划多少的 complexity 控制。响应时间是首要考虑时选 Flare。在 APIPod 中，公开模型 ID 为
    gpt-image-2.6-flare，支持文生图与参考图编辑，GIF 与 SVG 结果以转存后的产物地址返回。
servers:
  - url: https://api.apipod.ai
    description: 生产环境
paths:
  /v1/images/generations:
    post:
      summary: 创建生成任务
      description: GPT Image 2.6 Flare 是 OpenAI GPT Image 2.6 图片系列中注重速度的档位。它保留 2.5 的保真档位，并新增三项能力：循环 GIF
        动画、可编辑的 SVG 矢量输出，以及决定模型渲染前规划多少的 complexity 控制。响应时间是首要考虑时选 Flare。在 APIPod 中，公开模型 ID 为
        gpt-image-2.6-flare，支持文生图与参考图编辑，GIF 与 SVG 结果以转存后的产物地址返回。
      operationId: create-gpt-image-2.6-gpt-image-2.6-flare
      tags:
        - GPT Image 2.6 Flare
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: GPT Image 2.6 Flare
              required:
                - model
                - prompt
              properties:
                model:
                  type: string
                  title: Model ID
                  description: APIPod 公开模型 ID。
                  const: gpt-image-2.6-flare
                prompt:
                  type: string
                  title: Prompt
                  maxLength: 32000
                  description: 生成或编辑指令。输出 GIF 时需写明主体、运动方式与循环目标。
                image_urls:
                  type: array
                  title: Image Urls
                  maxItems: 16
                  items:
                    type: string
                  description: 可公开访问的源图或参考图 URL。与 gif、svg 输出不能同时使用。
                output_format:
                  enum:
                    - png
                    - jpeg
                    - webp
                    - gif
                    - svg
                  type: string
                  title: Output Format
                  default: png
                  description: 输出格式。gif 与 svg 是 GPT Image 2.6 新增能力，仅支持文生图；svg 一次只返回一个结果，两者都不支持 output_compression
                    与透明背景。
                complexity:
                  enum:
                    - low
                    - medium
                    - high
                  type: string
                  title: Complexity
                  default: high
                  description: 渲染前的规划复杂度。low 适合改背景这类聚焦型编辑，high 适合密集文字与复杂版式；缺省为 high，不额外收费。
                quality:
                  enum:
                    - auto
                    - low
                    - medium
                    - high
                    - xhigh
                    - max
                  type: string
                  title: Quality
                  default: auto
                  description: 保真档位。background 为 transparent 时不得低于 medium。
                background:
                  enum:
                    - auto
                    - opaque
                    - transparent
                  type: string
                  title: Background
                  default: auto
                  description: 背景模式。transparent 返回带 alpha 通道的图片，并要求 quality 不低于 medium。
                aspect_ratio:
                  enum:
                    - auto
                    - 1:1
                    - 2:3
                    - 3:2
                    - 3:4
                    - 4:3
                    - 4:5
                    - 5:4
                    - 9:16
                    - 16:9
                    - 21:9
                  type: string
                  title: Aspect Ratio
                  default: auto
                  description: 生成图片的宽高比。
                resolution:
                  enum:
                    - 1K
                    - 2K
                    - 4K
                  type: string
                  title: Resolution
                  default: 1K
                  description: 生成图片的分辨率档位。
                size:
                  type: string
                  title: Size
                  description: 可选的精确像素通道，格式为 宽x高（例如 1024x1536）。宽高必须是 16 的倍数且不超过 3840；与 resolution、aspect_ratio 同时出现时以
                    size 为准。1K/2K/4K 档位配合 15 种宽高比已覆盖常见尺寸，GIF 单帧也可直接使用，因此只有像素级对齐或非标准比例时才需要 size。
                frame_count:
                  type: integer
                  title: Frame Count
                  minimum: 2
                  maximum: 64
                  default: 9
                  description: GIF 总帧数，取值 2-64。仅当 output_format 为 gif 时生效，缺省为 9。
                frame_duration_ms:
                  type: integer
                  title: Frame Duration (ms)
                  minimum: 20
                  maximum: 2000
                  default: 200
                  description: GIF 每帧时长（毫秒），取值 20-2000。仅当 output_format 为 gif 时生效，缺省为 200。
                output_compression:
                  type: integer
                  title: Output Compression
                  minimum: 0
                  maximum: 100
                  description: jpeg 与 webp 的输出压缩率，取值 0-100。gif 与 svg 不支持该参数。
                moderation:
                  enum:
                    - low
                    - auto
                  type: string
                  title: Moderation
                  default: low
                  description: 内容审核严格度。APIPod 对 GPT Image 2.6 默认下发 low 以减少误拦；传 auto 可恢复 OpenAI 默认的严格过滤。
                svg:
                  type: object
                  title: SVG Config
                  description: SVG 写作模型配置，仅在 output_format=svg 时读取。SVG 的生成方式是先出一张参考位图，再由文本模型重写成矢量。省略整个对象时平台默认使用写作模型
                    gpt-5.4-mini，也可通过 svg.model 指定其它具备文本 token 定价的模型。
                  properties:
                    model:
                      type: string
                      title: SVG Model
                      minLength: 1
                      default: gpt-5.4-mini
                      description: 用于写作 SVG 的文本模型，必须具备文本 token 定价。省略时默认 gpt-5.4-mini。
                    reasoning:
                      type: object
                      title: SVG Reasoning
                      description: SVG 写作模型的推理设置，与图片 complexity 相互独立。省略 effort 时使用该模型的默认值。
                      properties:
                        effort:
                          enum:
                            - none
                            - minimal
                            - low
                            - medium
                            - high
                            - xhigh
                            - max
                          type: string
                          title: Reasoning Effort
                          description: SVG 写作模型投入的推理强度。
                  x-apipod-ui:
                    component: hidden
            example:
              model: gpt-image-2.6-flare
              prompt: A premium product photograph on a dark studio set, precise typography, soft rim lighting,
                highly detailed.
              quality: auto
              aspect_ratio: auto
              resolution: 1K
      responses:
        "200":
          description: 任务已受理
          content:
            application/json:
              schema:
                type: object
                title: Task Submit Response
                required:
                  - code
                  - message
                  - data
                properties:
                  code:
                    type: integer
                    description: HTTP 状态码。
                  data:
                    type: object
                    title: Task Submit Data
                    properties:
                      task_id:
                        type: string
                        description: 用于查询任务状态的 APIPod 任务 ID。
                    description: 响应数据。
                  message:
                    type: string
                    description: 响应消息。
                description: Standard response for task submission
              example:
                code: 200
                message: success
                data:
                  task_id: img_task_01JEXAMPLE
      x-codeSamples:
        - lang: Shell
          label: cURL
          source: >-
            curl https://api.apipod.ai/v1/images/generations \
              -H "Authorization: Bearer $APIPOD_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{
              "model": "gpt-image-2.6-flare",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "quality": "auto",
              "aspect_ratio": "auto",
              "resolution": "1K"
            }'
        - lang: Python
          label: Python
          source: >-
            import os

            import requests


            payload = {
              "model": "gpt-image-2.6-flare",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "quality": "auto",
              "aspect_ratio": "auto",
              "resolution": "1K"
            }


            response = requests.post(
                "https://api.apipod.ai/v1/images/generations",
                headers={
                    "Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}",
                    "Content-Type": "application/json",
                },
                json=payload,
                timeout=60,
            )

            response.raise_for_status()

            print(response.json())
        - lang: Go
          label: Go
          source: >-
            package main


            import (
                "bytes"
                "encoding/json"
                "fmt"
                "net/http"
                "os"
            )


            func main() {
                payload := map[string]any{}
                if err := json.Unmarshal([]byte(`{
              "model": "gpt-image-2.6-flare",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "quality": "auto",
              "aspect_ratio": "auto",
              "resolution": "1K"
            }`), &payload); err != nil {
                    panic(err)
                }
                body, err := json.Marshal(payload)
                if err != nil {
                    panic(err)
                }

                req, err := http.NewRequest(http.MethodPost, "https://api.apipod.ai/v1/images/generations", bytes.NewReader(body))
                if err != nil {
                    panic(err)
                }
                req.Header.Set("Authorization", "Bearer "+os.Getenv("APIPOD_API_KEY"))
                req.Header.Set("Content-Type", "application/json")

                resp, err := http.DefaultClient.Do(req)
                if err != nil {
                    panic(err)
                }
                defer resp.Body.Close()
                fmt.Println(resp.Status)
            }
        - lang: Rust
          label: Rust
          source: >-
            use reqwest::Client;

            use serde_json::json;

            use std::env;


            #[tokio::main]

            async fn main() -> Result<(), Box<dyn std::error::Error>> {
                let payload = json!({
              "model": "gpt-image-2.6-flare",
              "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
              "quality": "auto",
              "aspect_ratio": "auto",
              "resolution": "1K"
            });
                let response = Client::new()
                    .post("https://api.apipod.ai/v1/images/generations")
                    .bearer_auth(env::var("APIPOD_API_KEY")?)
                    .json(&payload)
                    .send()
                    .await?
                    .error_for_status()?;

                println!("{}", response.text().await?);
                Ok(())
            }
        - lang: JavaScript
          label: JavaScript
          source: >-
            const response = await fetch("https://api.apipod.ai/v1/images/generations", {
              method: "POST",
              headers: {
                Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
                "Content-Type": "application/json",
              },
              body: JSON.stringify(
              {
                "model": "gpt-image-2.6-flare",
                "prompt": "A premium product photograph on a dark studio set, precise typography, soft rim lighting, highly detailed.",
                "quality": "auto",
                "aspect_ratio": "auto",
                "resolution": "1K"
              }
              ),
            });


            if (!response.ok) {
              throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);
            }


            console.log(await response.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: 在 Authorization 请求头中使用 Bearer APIPod_API_KEY。
