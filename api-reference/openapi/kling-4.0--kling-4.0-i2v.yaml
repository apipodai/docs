openapi: 3.1.0
info:
  title: Kling 4.0 Image to Video API
  version: 1.0.0
  description: Kling 4.0 I2V is APIPod's keyframe image-to-video mode for Kling 4.0, generating 3-30 second
    clips that pass through a first frame, up to 8 middle keyframes and an optional last frame. In APIPod,
    the public model ID is kling-4.0-i2v. It accepts text and image inputs mentioned as @first_frame /
    @keyframe_N / @last_frame and returns results through asynchronous video tasks.
servers:
- url: https://api.apipod.ai
  description: Production
paths:
  /v1/videos/generations:
    post:
      summary: Create Generation Task
      description: Kling 4.0 I2V is APIPod's keyframe image-to-video mode for Kling 4.0, generating 3-30
        second clips that pass through a first frame, up to 8 middle keyframes and an optional last frame.
        In APIPod, the public model ID is kling-4.0-i2v. It accepts text and image inputs mentioned as
        @first_frame / @keyframe_N / @last_frame and returns results through asynchronous video tasks.
      operationId: create-kling-4.0-kling-4.0-i2v
      tags:
      - Kling 4.0 Image to Video
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              title: Kling 4.0 Image to Video
              properties:
                model:
                  type: string
                  title: Model ID
                  description: Public APIPod model ID.
                  const: kling-4.0-i2v
                prompt:
                  type: string
                  title: Prompt
                  description: Required, up to 8,000 characters. Mention the frames you uploaded as `@first_frame`,
                    `@keyframe_1`..`@keyframe_N` and `@last_frame`; only provided frames can be mentioned,
                    otherwise the request is rejected.
                  minLength: 1
                  maxLength: 8000
                image_urls:
                  type: array
                  title: First / Last Frame
                  description: Required. `image_urls[0]` is the first frame; an optional `image_urls[1]`
                    is the last frame. Put middle frames in `keyframe_urls`. The output aspect ratio follows
                    the first frame. `first_frame_image` / `last_frame_image` are accepted as aliases.
                  minItems: 1
                  maxItems: 2
                  items:
                    type: string
                keyframe_urls:
                  type: array
                  title: Keyframes
                  description: Optional middle frames in chronological order (up to 8), mentioned as `@keyframe_1`..`@keyframe_N`.
                    Requires a first frame; the total frame count is capped by `duration`.
                  maxItems: 8
                  items:
                    type: string
                duration:
                  type: integer
                  title: Duration
                  description: 'Output duration in seconds (3-30). Defaults to 5. Also caps the total
                    number of frames (first + keyframes + last): 3s → 4, 4s → 5, 5s → 6, 6s → 7, 7s →
                    8, 8s → 9, 9s or longer → 10.'
                  minimum: 3
                  maximum: 30
                  default: 5
                resolution:
                  type: string
                  title: Resolution
                  description: Output resolution. Defaults to 720p. 4K is not available for Kling 4.0.
                  enum:
                  - 720p
                  - 1080p
                  default: 720p
                callback_url:
                  type: string
                  title: Callback URL
                  description: HTTPS URL that receives the task's terminal state.
                  default: ''
              required:
              - model
              - prompt
              - image_urls
            examples:
              keyframes:
                summary: First, middle and last frames
                value:
                  model: kling-4.0-i2v
                  prompt: The girl in @first_frame walks out, passes the street in @keyframe_1 and arrives
                    at the party in @last_frame.
                  image_urls:
                  - https://cdn.example.com/first.png
                  - https://cdn.example.com/last.png
                  keyframe_urls:
                  - https://cdn.example.com/street.png
                  duration: 10
                  resolution: 720p
              first_frame:
                summary: First frame only
                value:
                  model: kling-4.0-i2v
                  prompt: The camera slowly pushes in as @first_frame comes alive.
                  image_urls:
                  - https://cdn.example.com/first.png
                  duration: 5
      responses:
        '200':
          description: Task accepted
          content:
            application/json:
              schema:
                type: object
                title: Task Submit Response
                description: Standard response for task submission
                properties:
                  code:
                    type: integer
                  data:
                    type: object
                    title: Task Submit Data
                    description: Data content for task submission
                    properties:
                      task_id:
                        type: string
                        description: Task ID used to query the task status.
                  message:
                    type: string
                required:
                - code
                - message
                - data
              example:
                code: 200
                message: success
                data:
                  task_id: vid_task_01JEXAMPLE
      x-codeSamples:
      - lang: Shell
        label: cURL
        source: |-
          curl https://api.apipod.ai/v1/videos/generations \
            -H "Authorization: Bearer $APIPOD_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
            "model": "kling-4.0-i2v",
            "prompt": "The girl in @first_frame walks out, passes the street in @keyframe_1 and arrives at the party in @last_frame.",
            "image_urls": [
              "https://cdn.example.com/first.png",
              "https://cdn.example.com/last.png"
            ],
            "keyframe_urls": [
              "https://cdn.example.com/street.png"
            ],
            "duration": 10,
            "resolution": "720p"
          }'
      - lang: Python
        label: Python
        source: |-
          import os
          import requests

          payload = {
            "model": "kling-4.0-i2v",
            "prompt": "The girl in @first_frame walks out, passes the street in @keyframe_1 and arrives at the party in @last_frame.",
            "image_urls": [
              "https://cdn.example.com/first.png",
              "https://cdn.example.com/last.png"
            ],
            "keyframe_urls": [
              "https://cdn.example.com/street.png"
            ],
            "duration": 10,
            "resolution": "720p"
          }

          response = requests.post(
              "https://api.apipod.ai/v1/videos/generations",
              headers={
                  "Authorization": f"Bearer {os.environ['APIPOD_API_KEY']}",
                  "Content-Type": "application/json",
              },
              json=payload,
              timeout=60,
          )
          response.raise_for_status()
          print(response.json())
      - lang: Go
        label: Go
        source: |-
          package main

          import (
              "bytes"
              "fmt"
              "io"
              "net/http"
              "os"
          )

          func main() {
              body := []byte(`{
            "model": "kling-4.0-i2v",
            "prompt": "The girl in @first_frame walks out, passes the street in @keyframe_1 and arrives at the party in @last_frame.",
            "image_urls": [
              "https://cdn.example.com/first.png",
              "https://cdn.example.com/last.png"
            ],
            "keyframe_urls": [
              "https://cdn.example.com/street.png"
            ],
            "duration": 10,
            "resolution": "720p"
          }`)

              req, err := http.NewRequest(http.MethodPost, "https://api.apipod.ai/v1/videos/generations", bytes.NewReader(body))
              if err != nil {
                  panic(err)
              }
              req.Header.Set("Authorization", "Bearer "+os.Getenv("APIPOD_API_KEY"))
              req.Header.Set("Content-Type", "application/json")

              resp, err := http.DefaultClient.Do(req)
              if err != nil {
                  panic(err)
              }
              defer resp.Body.Close()
              out, _ := io.ReadAll(resp.Body)
              fmt.Println(resp.Status, string(out))
          }
      - lang: Rust
        label: Rust
        source: |-
          use reqwest::Client;
          use serde_json::json;
          use std::env;

          #[tokio::main]
          async fn main() -> Result<(), Box<dyn std::error::Error>> {
              let payload = json!({
                "model": "kling-4.0-i2v",
                "prompt": "The girl in @first_frame walks out, passes the street in @keyframe_1 and arrives at the party in @last_frame.",
                "image_urls": [
                  "https://cdn.example.com/first.png",
                  "https://cdn.example.com/last.png"
                ],
                "keyframe_urls": [
                  "https://cdn.example.com/street.png"
                ],
                "duration": 10,
                "resolution": "720p"
              });
              let response = Client::new()
                  .post("https://api.apipod.ai/v1/videos/generations")
                  .bearer_auth(env::var("APIPOD_API_KEY")?)
                  .json(&payload)
                  .send()
                  .await?
                  .error_for_status()?;

              println!("{}", response.text().await?);
              Ok(())
          }
      - lang: JavaScript
        label: JavaScript
        source: |-
          const response = await fetch("https://api.apipod.ai/v1/videos/generations", {
            method: "POST",
            headers: {
              Authorization: `Bearer ${process.env.APIPOD_API_KEY}`,
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              "model": "kling-4.0-i2v",
              "prompt": "The girl in @first_frame walks out, passes the street in @keyframe_1 and arrives at the party in @last_frame.",
              "image_urls": [
                "https://cdn.example.com/first.png",
                "https://cdn.example.com/last.png"
              ],
              "keyframe_urls": [
                "https://cdn.example.com/street.png"
              ],
              "duration": 10,
              "resolution": "720p"
            }),
          });

          if (!response.ok) {
            throw new Error(`APIPod request failed: ${response.status} ${await response.text()}`);
          }

          console.log(await response.json());
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: APIPod API key
      description: Use your APIPod API key as a Bearer token in the Authorization header.
